<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Bar Italia — The Cost of the Details</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:1920px; height:1080px; overflow:hidden;
    font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;
    background:#f4ede0; color:#142b1a;
  }
  .stage {
    width:1920px; height:1080px; position:relative;
    background:
      radial-gradient(ellipse at top left, rgba(227,183,108,0.22), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(23,76,37,0.12), transparent 60%),
      #f4ede0;
    display:flex;
  }

  /* LEFT BRAND PANEL ----------------------------------------- */
  .left {
    flex:1;
    display:flex; flex-direction:column;
    justify-content:space-between;
    padding:60px 56px 60px 80px;
    min-width:0;
  }

  .logo { height:120px; width:auto; display:block; }
  .eyebrow {
    font-size:20px; letter-spacing:8px; color:#174c25;
    text-transform:uppercase; font-weight:700;
    margin-top:24px;
  }

  .headline {
    font-family:'Playfair Display','Baskerville','Times New Roman',serif;
    font-size:128px; font-weight:700; color:#142b1a;
    line-height:0.95; letter-spacing:1px;
  }
  .headline em {
    font-style:italic; color:#174c25;
  }
  .rule {
    width:160px; height:6px;
    background:#e3b76c;
    margin:36px 0 32px;
    border-radius:3px;
  }
  .sub {
    font-size:34px; line-height:1.4; color:#142b1a;
    font-weight:500;
    max-width:920px;
  }
  .sub strong { color:#174c25; font-weight:700; }

  .quote-card {
    background:#174c25;
    color:#f4ede0;
    border-left:6px solid #e3b76c;
    border-radius:6px;
    padding:32px 40px;
    display:flex; align-items:center; justify-content:space-between;
    gap:30px;
  }
  .quote-text {
    font-family:'Playfair Display','Baskerville',serif;
    font-size:38px; font-weight:700;
    letter-spacing:2px; text-transform:uppercase;
    line-height:1.2;
  }
  .quote-text span { color:#e3b76c; }
  .grazie {
    font-family:'Brush Script MT','Lucida Handwriting',cursive;
    font-size:80px; color:#e3b76c;
    font-style:italic; line-height:1;
    flex-shrink:0;
  }

  /* RIGHT POSTER PANEL --------------------------------------- */
  .right {
    width:870px;
    height:1080px;
    position:relative;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:#ffffff;
    border-left:3px solid #e3b76c;
    box-shadow:-10px 0 32px rgba(20,43,26,0.12);
    padding:30px 20px;
  }
  .right img {
    height:1020px;
    width:auto;
    max-width:100%;
    display:block;
    object-fit:contain;
  }
</style>
</head>
