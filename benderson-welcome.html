<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
.slide{position:relative;width:1920px;height:1080px;
  background:
    radial-gradient(1300px 620px at 50% -8%, rgba(232,160,32,.16), rgba(232,160,32,0) 70%),
    radial-gradient(900px 500px at 50% 118%, rgba(232,160,32,.07), rgba(232,160,32,0) 70%),
    linear-gradient(180deg,#12244a 0%,#0f1f3d 46%,#0c1830 100%);
  display:flex;flex-direction:column;padding:50px 72px 46px;
  font-family:Georgia,'Times New Roman',serif;color:#f5ede0}
.frame{position:absolute;inset:26px;border:1.4px solid rgba(232,160,32,.42);pointer-events:none}
.frame::before{content:'';position:absolute;inset:7px;border:.8px solid rgba(232,160,32,.20)}
.header{display:flex;align-items:center;justify-content:center;gap:26px;flex:0 0 auto;z-index:2}
.header .rule{height:1px;width:150px;background:linear-gradient(90deg,rgba(232,160,32,0),rgba(232,160,32,.7))}
.header .rule.r{transform:scaleX(-1)}
.brand{font-size:27px;letter-spacing:.46em;color:#e8a020;font-weight:400;text-indent:.46em}
.hero{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:2}
.eyebrow{font-family:Arial,Helvetica,sans-serif;font-size:17px;letter-spacing:.42em;color:#cbb27a;text-indent:.42em}
.welcome{font-size:118px;line-height:.96;letter-spacing:.12em;color:#f7efe1;text-indent:.12em;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.sub{font-style:italic;font-size:42px;color:#e8a020;letter-spacing:.02em;margin-top:-4px}
.card{margin-top:14px;background:#fcfaf5;border:1.5px solid rgba(232,160,32,.55);border-radius:10px;
  box-shadow:0 18px 50px rgba(0,0,0,.45);padding:40px 70px;display:flex;align-items:center;justify-content:center}
.card img{width:680px;height:auto;display:block}
.date{font-family:Arial,Helvetica,sans-serif;font-size:18px;letter-spacing:.40em;color:#cbb27a;text-indent:.40em;margin-top:8px}
.family{flex:0 0 auto;z-index:2}
.famhead{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:20px}
.famhead .rule{height:1px;flex:1;max-width:360px;background:linear-gradient(90deg,rgba(232,160,32,0),rgba(232,160,32,.55))}
.famhead .rule.r{transform:scaleX(-1)}
.famlabel{font-family:Arial,Helvetica,sans-serif;font-size:16px;letter-spacing:.34em;color:#e8a020;text-indent:.34em;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;column-gap:0;row-gap:14px}
.cell{display:flex;align-items:center;justify-content:center;height:150px;position:relative;padding:0 22px}
.cell + .cell::before{content:'';position:absolute;left:0;top:24px;bottom:24px;width:1px;background:rgba(232,160,32,.20)}
.cell:nth-child(4n+1)::before{display:none}
.cell img{max-width:300px;max-height:96px;width:auto;height:auto;display:block}
.cell img.bi{max-height:54px;max-width:300px}
.cell img.river{max-height:96px}
.cell img.ccg{max-height:60px;max-width:310px}
.cell img.lake{max-height:50px}
.cell img.fuoco{max-height:118px}
.cell img.jojos{max-height:124px}
.cell img.lola{max-height:120px}
.arl{text-align:center}
.arl .nm{font-size:33px;letter-spacing:.12em;color:#f5ede0;text-indent:.12em}
.arl .sub2{font-family:Arial,Helvetica,sans-serif;font-size:14px;letter-spacing:.30em;color:#e8a020;text-indent:.30em;margin-top:9px}
</style></head>
