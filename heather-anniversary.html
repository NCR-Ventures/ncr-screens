<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Heather — 14 Years</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#f7f5f0;font-family:Georgia,'Times New Roman',serif}
.slide{position:relative;width:1920px;height:1080px;overflow:hidden;display:flex}
.photo{position:relative;width:1200px;height:1080px;overflow:hidden;flex:none;background:#222}
.stage{position:absolute;left:0;top:0;width:1440px;height:1080px}
.stage img{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.screen{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:linear-gradient(#0d5aa3,#06294d);backface-visibility:hidden}
.rays{position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,0) 0 70px,rgba(190,235,255,.16) 90px,rgba(255,255,255,0) 130px);animation:rays 9s ease-in-out infinite alternate;mix-blend-mode:screen}
@keyframes rays{from{transform:translateX(-50px)}to{transform:translateX(50px)}}
.sand{position:absolute;left:-10px;right:-10px;bottom:0;height:70px;background:linear-gradient(#e8d19b,#b99a5a);border-radius:50% 50% 0 0/40% 40% 0 0}
.rock{position:absolute;bottom:34px;background:#6c6f78;border-radius:50% 50% 8% 8%}
.r1{left:150px;width:90px;height:56px}.r2{left:640px;width:120px;height:70px;background:#5b5e66}
.weed{position:absolute;bottom:30px;width:34px;transform-origin:50% 100%;animation:sway 4.5s ease-in-out infinite alternate;opacity:.95}
@keyframes sway{from{transform:skewX(-9deg)}to{transform:skewX(9deg)}}
.bub{position:absolute;bottom:60px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.15);animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-520px);opacity:0}}
.fish{position:absolute;left:0;width:200px;animation-timing-function:linear;animation-iteration-count:infinite}
.fish.r{animation-name:swimR}.fish.l{animation-name:swimL}
@keyframes swimR{from{transform:translateX(-260px)}to{transform:translateX(1100px)}}
@keyframes swimL{from{transform:translateX(1100px)}to{transform:translateX(-260px)}}
.bob{animation:bob 3.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-14px)}to{transform:translateY(14px)}}
.face{transform:scale(var(--sz))}
.fish.l .face{transform:scaleX(-1) scale(var(--sz))}
.face svg{display:block;overflow:visible}
.tail{transform-box:fill-box;transform-origin:100% 50%;animation:wag .45s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.glare{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 38%)}
svg.fx{position:absolute;left:0;top:0;width:1440px;height:1080px;pointer-events:none}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .32s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.92,1.08) rotate(2deg)}100%{transform:scale(1.05,.93) rotate(-1deg)}}
.glow{animation:glow .5s ease-in-out infinite alternate;mix-blend-mode:screen}
@keyframes glow{from{opacity:.7}to{opacity:1}}
.cakeglow{position:absolute;left:613.3540372670807px;top:549.6273291925465px;width:400px;height:220px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,170,60,.55),rgba(255,140,40,0) 68%);mix-blend-mode:screen;animation:glow .6s ease-in-out infinite alternate}
.vign{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0) 85%,rgba(0,0,0,.18))}
.panel{flex:1;position:relative;background:#f7f5f0;display:flex;flex-direction:column;justify-content:space-between;padding:44px 52px 44px 56px;border-left:10px solid #c9962f}
.brand{font:700 30px Arial,Helvetica,sans-serif;letter-spacing:7px;color:#c9962f}
.bar{height:5px;background:#c9962f;border-radius:3px;margin-top:14px}
.hwa{font:700 58px/1.05 Georgia,serif;color:#2b2b28;letter-spacing:2px}
.big{display:flex;flex-direction:column;align-items:center;line-height:.82}
.n14{font:700 400px/0.8 Georgia,serif;color:#c9962f;letter-spacing:-8px;text-shadow:5px 6px 0 #e5cf85}
.yrs{font:700 112px/1 Georgia,serif;color:#8a611f;letter-spacing:26px;margin-left:26px;margin-top:20px}
.who .nm{font:700 66px/1.05 Georgia,serif;color:#2b2b28}
.who .tt{font:400 34px Arial,Helvetica,sans-serif;color:#63655f;margin-top:12px;letter-spacing:1px}
.thanks{background:#2b2b28;color:#fff;border-radius:14px;padding:26px 30px;font:italic 700 44px/1.15 Georgia,serif;text-align:center;border-bottom:6px solid #c9962f}
.thanks b{color:#e8c46a}
</style></head><body>
