<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;600;700&family=Caveat:wght@600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    width: 1920px; height: 1080px;
    overflow: hidden; background: #f7f4ef; display: flex;
  }

  .left {
    width: 840px; height: 1080px;
    background: #f7f4ef;
    flex-shrink: 0; z-index: 1;
    position: relative;
  }

  /* Centered content block */
  .center-block {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    left: 76px; right: 60px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .header-row {
    display: flex; align-items: center; gap: 18px;
  }
  .dog-logo { width: 110px; height: auto; opacity: 0.88; flex-shrink: 0; }
  .wordmark { height: 52px; width: auto; opacity: 0.9; }

  .divider-group { display: flex; flex-direction: column; gap: 12px; }
  .rule { width: 46px; height: 2px; background: #4a6881; }
  .feature-label {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700; font-size: 13px;
    letter-spacing: 4px; text-transform: uppercase; color: #4a6881;
  }

  .dish-name {
    font-family: 'Libre Baskerville', serif;
    font-weight: 700; font-size: 86px; line-height: 1.05;
    color: #27262a;
  }

  .description {
    font-family: 'Libre Baskerville', serif;
    font-style: italic; font-size: 26px; line-height: 1.5;
    color: #5c5856;
  }

  .price-block {
    display: flex; align-items: baseline; gap: 5px;
  }
  .price-dollar {
    font-family: 'Libre Baskerville', serif;
    font-size: 36px; color: #4a6881; font-weight: 400;
  }
  .price-amount {
    font-family: 'Libre Baskerville', serif;
    font-size: 86px; font-weight: 700; color: #27262a; line-height: 1;
  }

  /* Footer pinned to bottom */
  .footer {
    position: absolute;
    bottom: 44px; left: 76px; right: 60px;
    border-top: 1px solid #c8bfb0;
    padding-top: 14px;
    display: flex; align-items: center; gap: 14px;
  }
  .footer-script { font-family: 'Caveat', cursive; font-size: 23px; color: #7a7068; font-weight: 600; }
  .footer-dot { width: 4px; height: 4px; border-radius: 50%; background: #aaa098; }
  .footer-addr { font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 2px; color: #9a9088; text-transform: uppercase; }

  .right { flex: 1; height: 1080px; position: relative; overflow: hidden; }
  .hero-photo { width: 100%; height: 100%; object-fit: cover; object-position: center 15%; display: block; }
  .right::before {
    content: ''; position: absolute;
    left: 0; top: 0; bottom: 0; width: 130px;
    background: linear-gradient(to right, #f7f4ef, transparent); z-index: 2;
  }
</style>
</head>
