<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Memorial Day Family Meal — Bar Fuoco</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    font-family: 'Georgia', serif;
    background: #0a1d3a;
    color: #fff;
  }
  .stage {
    width: 1920px; height: 1080px;
    position: relative;
    background: linear-gradient(135deg, #0a1d3a 0%, #14264a 50%, #0a1d3a 100%);
    overflow: hidden;
  }

  /* Bunting strip across the top */
  .bunting {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 70px;
    display: flex;
    z-index: 5;
  }
  .bunting-swag {
    flex: 1;
    background: linear-gradient(180deg, #b22234 0%, #b22234 33%, #ffffff 33%, #ffffff 66%, #3c3b6e 66%, #3c3b6e 100%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    margin: 0 1px;
    box-shadow: inset 0 -4px 8px rgba(0,0,0,0.25);
  }

  /* Bottom bunting strip */
  .bunting-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 70px;
    display: flex;
    z-index: 5;
    transform: scaleY(-1);
  }

  /* Stars decoration */
  .star {
    position: absolute;
    color: #e8a020;
    font-size: 40px;
    z-index: 4;
    text-shadow: 0 0 12px rgba(232,160,32,0.6);
  }
  .star.s1 { top: 90px; left: 40px; }
  .star.s2 { top: 90px; right: 40px; }
  .star.s3 { bottom: 90px; left: 40px; transform: scaleY(-1); }
  .star.s4 { bottom: 90px; right: 40px; transform: scaleY(-1); }

  /* Main content area */
  .content {
    position: absolute;
    top: 90px; bottom: 90px; left: 40px; right: 40px;
    display: flex;
    gap: 40px;
  }

  /* Hero photo on left */
  .hero-photo {
    width: 1080px;
    height: 100%;
    border-radius: 18px;
    overflow: hidden;
    border: 6px solid #e8a020;
    box-shadow: 0 14px 50px rgba(0,0,0,0.6), 0 0 0 3px #b22234;
    position: relative;
  }
  .hero-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .hero-tag {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, rgba(10,29,58,0) 0%, rgba(10,29,58,0.85) 50%, rgba(10,29,58,0.95) 100%);
    padding: 60px 30px 24px;
    text-align: center;
  }
  .hero-tag .names {
    font-family: 'Georgia', serif;
    font-style: italic;
    font-size: 36px;
    color: #fff;
    letter-spacing: 1px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
  }
  .hero-tag .names .amp {
    color: #e8a020;
    font-weight: bold;
  }
  .hero-tag .sub {
    font-size: 22px;
    color: #f0e0b0;
    margin-top: 6px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Helvetica Neue', sans-serif;
  }

  /* Right column */
  .info-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 10px 0;
  }

  .eyebrow {
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #e8a020;
    text-align: center;
    font-weight: 700;
  }

  .title-block {
    text-align: center;
    padding-top: 4px;
  }
  .title {
    font-family: 'Georgia', serif;
    font-size: 92px;
    line-height: 0.95;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 0 4px 12px rgba(0,0,0,0.6);
    letter-spacing: -1px;
  }
  .title .red { color: #ff4655; }
  .title .gold { color: #e8a020; }
  .title-rule {
    width: 70%;
    margin: 18px auto 0;
    height: 4px;
    background: linear-gradient(90deg, transparent 0%, #e8a020 20%, #ffffff 50%, #ff4655 80%, transparent 100%);
    border-radius: 2px;
  }

  /* When + Where card */
  .when-where {
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(232,160,32,0.45);
    border-radius: 16px;
    padding: 24px 28px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    box-shadow: 0 6px 22px rgba(0,0,0,0.35);
  }
  .ww-block { text-align: center; }
  .ww-label {
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #b8c4d8;
    margin-bottom: 6px;
  }
  .ww-value {
    font-family: 'Georgia', serif;
    font-size: 40px;
    font-weight: bold;
    color: #ffffff;
    line-height: 1.05;
  }
  .ww-sub {
    font-size: 18px;
    color: #f0e0b0;
    margin-top: 2px;
    font-style: italic;
  }
  .ww-divider {
    width: 2px;
    height: 70px;
    background: linear-gradient(180deg, transparent, #e8a020, transparent);
  }

  /* Menu card */
  .menu-card {
    background: linear-gradient(135deg, rgba(178,34,52,0.18) 0%, rgba(60,59,110,0.18) 100%);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 16px;
    padding: 22px 26px;
    box-shadow: 0 6px 22px rgba(0,0,0,0.35);
  }
  .menu-title {
    text-align: center;
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #e8a020;
    margin-bottom: 14px;
    font-weight: 700;
  }
  .menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 22px;
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Georgia', serif;
    font-size: 26px;
    color: #ffffff;
  }
  .menu-item .dot {
    color: #e8a020;
    font-size: 20px;
  }

  /* Who card */
  .who-card {
    background: linear-gradient(135deg, #b22234 0%, #8a1a26 100%);
    border-radius: 16px;
    padding: 20px 24px;
    text-align: center;
    box-shadow: 0 6px 22px rgba(0,0,0,0.45);
    border: 2px solid #e8a020;
  }
  .who-label {
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #f0e0b0;
    margin-bottom: 6px;
  }
  .who-line {
    font-family: 'Georgia', serif;
    font-size: 30px;
    font-weight: bold;
    color: #ffffff;
    line-height: 1.15;
  }
  .who-line .gold { color: #ffd770; }
</style>
</head>
