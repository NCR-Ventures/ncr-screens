<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Florida Week Scoreboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ffffff; font-family: Arial, Helvetica, sans-serif; color: #1a1a1a; }
  .slide { position: relative; width: 1920px; height: 1080px; display: flex; flex-direction: column; }
  .top { height: 150px; display: flex; align-items: center; justify-content: space-between; padding: 0 110px; border-bottom: 2px solid #e5e5e5; }
  .top .league { font-size: 44px; font-weight: 700; color: #1a1a1a; letter-spacing: 1px; }
  .top .league span { color: #888; font-weight: 400; margin-left: 10px; }
  .top .follow { border: 3px solid #1a1a1a; border-radius: 60px; padding: 14px 54px; font-size: 40px; font-weight: 600; }
  .board { flex: 1; display: flex; align-items: center; justify-content: space-between; padding: 0 110px; }
  .team { display: flex; flex-direction: column; align-items: center; width: 460px; }
  .badge { width: 300px; height: 300px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 120px; letter-spacing: -2px; box-shadow: 0 10px 30px rgba(0,0,0,0.18); }
  .badge.tb { background: #0b2a5b; }
  .badge.cle { background: #0f2552; color: #e31937; }
  .name { margin-top: 36px; font-size: 76px; font-weight: 700; }
  .record { margin-top: 10px; font-size: 44px; color: #777; }
  .score { font-size: 300px; font-weight: 400; line-height: 1; width: 320px; text-align: center; }
  .mid { display: flex; flex-direction: column; align-items: center; width: 320px; }
  .inning { font-size: 70px; color: #1e7a3b; font-weight: 600; }
  .inning u { text-decoration: none; border-bottom: 6px solid #1e7a3b; padding-bottom: 6px; }
  .bases { margin-top: 44px; width: 150px; height: 150px; position: relative; }
  .base { position: absolute; width: 56px; height: 56px; background: #d9d9d9; transform: rotate(45deg); }
  .base.first { right: 0; top: 47px; }
  .base.second { left: 47px; top: 0; }
  .base.third { left: 0; top: 47px; }
  .count { margin-top: 44px; font-size: 48px; color: #555; }
  .series { text-align: center; font-size: 46px; color: #666; padding-bottom: 24px; }
  .troll { height: 150px; background: #0f2552; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; letter-spacing: 0; white-space: nowrap; padding: 0 30px; }
  .troll span { color: #ffd84d; margin: 0 16px; }
</style>
</head>
<body>
<div class="slide">
  <div class="top">
    <div class="league">MLB <span>›</span>&nbsp; League Championship Series &nbsp;·&nbsp; Game 3</div>
    <div class="follow">Follow</div>
  </div>

  <div class="board">
    <div class="team">
      <div class="badge tb">TB</div>
      <div class="name">Rays</div>
      <div class="record">(1 - 1)</div>
    </div>

    <div class="score">2</div>

    <div class="mid">
      <div class="inning"><u>Top 4th</u></div>
      <div class="bases">
        <div class="base second"></div>
        <div class="base third"></div>
        <div class="base first"></div>
      </div>
      <div class="count">Simpson 3B, 2 RBI</div>
    </div>

    <div class="score">1</div>

    <div class="team">
      <div class="badge cle">C</div>
      <div class="name">Guardians</div>
      <div class="record">(1 - 1)</div>
    </div>
  </div>

  <div class="series">League Championship Series &nbsp;·&nbsp; Game 3 &nbsp;(Series tied 1 - 1)</div>

  <div class="troll">
    FLORIDA WEEK <span>☀</span> Welcome to Cleveland, Rays fans. Bring a jacket. <span>☀</span> Sarasota &amp; Winter Park: we see you.
  </div>
</div>
</body>
</html>
